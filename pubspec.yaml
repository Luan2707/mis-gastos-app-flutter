name: mis_gastos_app
description: Aplicación para controlar gastos e ingresos con Firebase.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0

  # UI
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  fl_chart: ^0.65.0
  iconsax: ^0.0.8

  # State Management
  provider: ^6.1.5

  # Utils
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
